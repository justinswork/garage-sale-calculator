name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Using `npm install` instead of `npm ci` — the lockfile contains
        # platform-specific esbuild binaries (Windows/macOS/NetBSD/Linux)
        # that npm ci tries to install strictly and fails on EBADPLATFORM.
        # `npm install` honors the lockfile but skips incompatible optional
        # deps gracefully.
        run: npm install

      - name: Run unit + integration tests
        run: npm run test:run

      - name: Build (smoke test)
        run: npm run build
        env:
          # Dummy Firebase config — build only validates compilation, no
          # runtime calls are made in CI.
          VITE_FIREBASE_API_KEY: ci-dummy
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-dummy
          VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: '0:0:web:0'
